
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Sorgt dafür, dass die Seite auf dem Handy in richtiger Größe angezeigt wird -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3Room</title>

  <!-- App-Symbol für den Startbildschirm -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    /* ===== Grundeinstellungen ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent; /* kein grauer Kasten beim Antippen */
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, system-ui, sans-serif;
      color: white;
      background: #000;
      padding: 56px 16px 40px;
    }

    /* ===== Kopfzeile: kleines Logo ===== */
    .kopf {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .kopf img {
      width: 32px;
      height: 32px;
    }

    /* Inhalt auf großen Bildschirmen nicht zu breit */
    .inhalt {
      max-width: 500px;
      margin: 0 auto;
    }

    /* ===== Suchleiste: schmal, dunkelgrau ===== */
    .suche {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      background: #1c1c1e;
      border: 1px solid transparent;  /* unsichtbar, damit beim Fokus nichts springt */
    }

    /* Beim Antippen: dünner Rand in der Akzentfarbe */
    .suche:focus-within {
      border-color: #ff8a00;
    }

    .suche svg {
      flex-shrink: 0;
    }

    /* Zeile oben: Suchleiste + Extensions-Knopf nebeneinander */
    .such-zeile {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .such-zeile .suche {
      flex: 1;                        /* Suchleiste nimmt den restlichen Platz */
    }

    /* Extensions-Knopf: quadratisch, gleicher Stil wie die Suchleiste */
    .ext-knopf {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #1c1c1e;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    /* Gleiche Drück-Animation wie bei den Icons */
    .ext-knopf:active {
      transform: scale(0.9);
    }

    .suche input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 16px;
    }

    .suche input::placeholder {
      color: #8e8e93;
    }

    /* ===== Raster mit 4 App-Icons pro Reihe ===== */
    .raster {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px 12px;
    }

    /* ===== Ein App-Icon ===== */
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: white;
      cursor: pointer;
    }

    /* Das abgerundete Quadrat: Logo füllt es komplett */
    .icon {
      width: 60px;
      aspect-ratio: 1;
      border-radius: 22%;
      overflow: hidden;
      background: #2c2c2e;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;  /* macht das Kleinerwerden weich */
    }

    .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Logo aus dem Feld "logo": zentriert, 60 % der Icon-Größe */
    .icon img.logo {
      width: 60%;
      height: 60%;
      object-fit: contain;
    }

    /* Animation beim Antippen: Icon wird kurz kleiner */
    .app:active .icon {
      transform: scale(0.9);
    }

    /* Icon "Extensions": schwarzer Hintergrund */
    .icon.schwarz {
      background: black;
    }

    /* Name unter dem Icon */
    .name {
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 76px;
    }

    /* ===== Fenster (Overlay) ===== */
    /* Abgedunkelter Hintergrund über der ganzen Seite */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;               /* versteckt, bis es geöffnet wird */
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }

    .overlay.offen {
      display: flex;
    }

    /* Das Fenster selbst: dunkelgrau */
    .fenster {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 22px;
      background: #1c1c1e;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .fenster-kopf {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .fenster-kopf h2 {
      font-size: 22px;
      font-weight: 700;
    }

    /* Runder X-Knopf zum Schließen */
    .schliessen {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 16px;
      line-height: 30px;
      cursor: pointer;
    }

    /* Suchleiste im Fenster: etwas heller, damit sie sich vom Fenster abhebt */
    .fenster .suche {
      margin-bottom: 16px;
      background: #2c2c2e;
    }

    /* Liste der Extensions */
    .ext-liste {
      border-radius: 14px;
      overflow: hidden;
    }

    .ext-eintrag {
      display: block;
      padding: 12px 14px;
      color: white;
      text-decoration: none;
      border-bottom: 1px solid #2c2c2e;  /* dezente graue Trennlinie */
    }

    .ext-eintrag:last-child {
      border-bottom: none;
    }

    .ext-eintrag:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .ext-name {
      font-size: 16px;
      font-weight: 600;
    }

    .ext-text {
      font-size: 13px;
      color: #8e8e93;
      margin-top: 2px;
    }

    /* Selbst hinzugefügte Einträge: kein Markieren/Link-Menü beim langen Drücken */
    .ext-eintrag.eigen {
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Knopf "+ Hinzufügen" */
    .hinzufuegen {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: #2c2c2e;
      color: #ff8a00;                 /* Akzentfarbe */
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .hinzufuegen:active {
      background: #3a3a3c;
    }

    /* Formular zum Hinzufügen (erst versteckt) */
    .ext-formular {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .ext-formular.offen {
      display: flex;
    }

    .ext-formular input {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: #2c2c2e;            /* heller als das Fenster, sonst unsichtbar */
      color: white;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .ext-formular input::placeholder {
      color: #8e8e93;
    }

    /* Kleiner grauer Hinweis ganz unten */
    .hinweis {
      margin-top: 14px;
      font-size: 12px;
      text-align: center;
      color: #8e8e93;
    }
  </style>
</head>
<body>

  <div class="inhalt">
    <!-- Kopfzeile: kleines Logo -->
    <header class="kopf">
      <img src="icon.svg" alt="3Room">
    </header>

    <!-- Suchleiste und daneben der Extensions-Knopf, in einer Zeile -->
    <div class="such-zeile">
      <form class="suche" id="suchformular">
        <!-- Lupen-Symbol (grau) -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input type="text" id="suchfeld" placeholder="Suchen" autocomplete="off">
      </form>

      <!-- Extensions-Knopf: lila Puzzleteil, öffnet das Extensions-Fenster -->
      <button class="ext-knopf" id="ext-knopf" type="button" aria-label="Extensions">
        <svg width="55%" height="55%" viewBox="0 0 24 24" fill="#7a12c4">
          <path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-2 .9-2 2v3.8h1.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/>
        </svg>
      </button>
    </div>

    <!-- Hier werden die App-Icons per JavaScript eingefügt -->
    <div class="raster" id="raster"></div>
  </div>

  <!-- Fenster "Extensions" (erst versteckt, öffnet sich beim Tipp auf den Puzzle-Knopf) -->
  <div class="overlay" id="ext-overlay">
    <div class="fenster">
      <div class="fenster-kopf">
        <h2>Extensions</h2>
        <button class="schliessen" aria-label="Schließen">✕</button>
      </div>

      <!-- Suche im Firefox-Add-on-Store -->
      <form class="suche" id="ext-suchformular">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input type="text" id="ext-suchfeld" placeholder="Add-ons suchen" autocomplete="off">
      </form>

      <!-- Hier wird die Liste per JavaScript eingefügt -->
      <div class="ext-liste" id="ext-liste"></div>

      <!-- Eigene Einträge hinzufügen -->
      <button class="hinzufuegen" id="ext-plus">+ Hinzufügen</button>
      <form class="ext-formular" id="ext-formular">
        <input type="text" id="ext-neu-name" placeholder="Name" autocomplete="off" required>
        <input type="text" id="ext-neu-link" placeholder="Link (optional)" autocomplete="off">
        <button type="submit" class="hinzufuegen">Speichern</button>
      </form>

      <p class="hinweis">Einstellungen ändern: Firefox ⋮ → Erweiterungen</p>
    </div>
  </div>

  <script>
    // =====================================================
    // DEINE APPS – hier kannst du einfach neue hinzufügen.
    // Einfach eine Zeile kopieren und Name, Link, Kategorie, Logo ändern.
    // (Die Kategorie wird im Moment nicht benutzt.)
    // Logo: Link von Simple Icons, z. B. https://cdn.simpleicons.org/NAME/FARBE
    // Ohne Logo wird das kleine Website-Symbol (Favicon) gezeigt.
    // =====================================================
    const apps = [
      { name: "YouTube",    kategorie: "Medien", link: "https://www.youtube.com",   logo: "https://cdn.simpleicons.org/youtube/FF0000" },
      { name: "Instagram",  kategorie: "Social", link: "https://www.instagram.com", logo: "https://cdn.simpleicons.org/instagram/E4405F" },
      { name: "Spotify",    kategorie: "Medien", link: "https://open.spotify.com",  logo: "https://cdn.simpleicons.org/spotify/1DB954" },
      { name: "Web",        kategorie: "Tools",  aktion: "suche" }, // setzt den Cursor in die Suchleiste
    ];

    // Globus-Symbol für das Icon "Web"
    const WEB_SVG = `
      <svg width="100%" height="100%" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="gl" gradientUnits="userSpaceOnUse"
            x1="0" y1="28" x2="0" y2="132">
            <stop offset="0" stop-color="#ffb000"/>
            <stop offset="0.5" stop-color="#ff5a3c"/>
            <stop offset="1" stop-color="#ff2d6e"/>
          </linearGradient>
        </defs>
        <rect width="160" height="160" rx="36" fill="#000"/>
        <g fill="none" stroke="url(#gl)" stroke-width="4">
          <circle cx="80" cy="80" r="52" stroke-width="5"/>
          <ellipse cx="80" cy="80" rx="22" ry="52"/>
          <line x1="28" y1="80" x2="132" y2="80"/>
          <path d="M36,54 Q80,64 124,54"/>
          <path d="M36,106 Q80,96 124,106"/>
        </g>
      </svg>`;

    // ===== Baut das abgerundete Quadrat einer App (ohne Link) =====
    function baueIcon(app) {
      const icon = document.createElement("div");
      icon.className = "icon";

      if (app.aktion === "suche") {
        icon.classList.add("schwarz");
        icon.innerHTML = WEB_SVG;
      } else if (app.logo) {
        // Scharfes SVG-Logo auf schwarzem Hintergrund
        icon.classList.add("schwarz");
        const bild = document.createElement("img");
        bild.className = "logo";
        bild.src = app.logo;
        bild.alt = "";
        icon.appendChild(bild);
      } else {
        // Domain aus dem Link holen, z. B. "www.youtube.com", und Logo laden
        const domain = new URL(app.link).hostname;
        icon.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=128" alt="">`;
      }
      return icon;
    }

    // ===== Baut eine antippbare App (Icon mit Name darunter) =====
    function baueApp(app) {
      const kachel = document.createElement("a");
      kachel.className = "app";
      kachel.appendChild(baueIcon(app));

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = app.name;
      kachel.appendChild(name);

      if (app.aktion === "suche") {
        kachel.href = "#";
        kachel.addEventListener("click", function (ereignis) {
          ereignis.preventDefault(); // "#" nicht in die Adresse schreiben
          document.getElementById("suchfeld").focus(); // Cursor rein, Tastatur geht auf
        });
      } else {
        kachel.href = app.link;  // öffnet im selben Tab
      }
      return kachel;
    }

    // ===== App-Icons ins Raster zeichnen =====
    const raster = document.getElementById("raster");
    for (const app of apps) raster.appendChild(baueApp(app));

    // ===== Fenster öffnen und schließen =====
    const extOverlay = document.getElementById("ext-overlay");

    function oeffne(overlay) {
      overlay.classList.add("offen");
    }

    // Puzzle-Knopf neben der Suchleiste öffnet das Extensions-Fenster
    document.getElementById("ext-knopf").addEventListener("click", function () {
      oeffne(extOverlay);
    });

    for (const overlay of document.querySelectorAll(".overlay")) {
      // X-Knopf schließt
      overlay.querySelector(".schliessen").addEventListener("click", function () {
        overlay.classList.remove("offen");
      });
      // Tipp außerhalb des Fensters (auf den dunklen Hintergrund) schließt
      overlay.addEventListener("click", function (ereignis) {
        if (ereignis.target === overlay) overlay.classList.remove("offen");
      });
    }

    // =====================================================
    // DEINE EXTENSIONS – hier kannst du neue hinzufügen.
    // Einfach eine Zeile kopieren und Name, Beschreibung, Link ändern.
    // =====================================================
    const extensions = [
      { name: "uBlock Origin", beschreibung: "Blockt Werbung",                       link: "https://addons.mozilla.org/de/android/addon/ublock-origin/" },
      { name: "SponsorBlock",  beschreibung: "Überspringt Werbeblöcke in Videos",    link: "https://addons.mozilla.org/de/android/addon/sponsorblock/" },
      { name: "Unhook",        beschreibung: "Blendet Empfehlungen und Shorts aus",  link: "https://addons.mozilla.org/de/android/search/?q=unhook" },
    ];

    // ===== Selbst hinzugefügte Einträge im Browser speichern (localStorage) =====
    const SPEICHER_NAME = "eigeneExtensions";

    function ladeEigene() {
      try {
        return JSON.parse(localStorage.getItem(SPEICHER_NAME)) || [];
      } catch (fehler) {
        return []; // z. B. im privaten Modus: dann eben leer
      }
    }

    function speichereEigene(liste) {
      try {
        localStorage.setItem(SPEICHER_NAME, JSON.stringify(liste));
      } catch (fehler) {
        // Speichern nicht möglich – Eintrag gilt dann nur bis zum Neuladen
      }
    }

    let eigene = ladeEigene();

    // Namen auf höchstens 21 Zeichen kürzen (20 Zeichen + "…")
    function kuerze(name) {
      return name.length > 21 ? name.slice(0, 20) + "…" : name;
    }

    // ===== Liste im Fenster füllen =====
    const extListe = document.getElementById("ext-liste");

    // Baut einen Listeneintrag (Name + optional Beschreibung)
    function baueEintrag(name, beschreibung, link) {
      const eintrag = document.createElement("a");
      eintrag.className = "ext-eintrag";
      eintrag.href = link;
      eintrag.innerHTML = `<div class="ext-name"></div><div class="ext-text"></div>`;
      eintrag.querySelector(".ext-name").textContent = kuerze(name);
      eintrag.querySelector(".ext-text").textContent = beschreibung;
      return eintrag;
    }

    function zeigeListe() {
      extListe.innerHTML = ""; // erst leeren, dann neu aufbauen

      // 1. Feste Einträge aus der Liste "extensions"
      for (const ext of extensions) {
        extListe.appendChild(baueEintrag(ext.name, ext.beschreibung, ext.link));
      }

      // 2. Selbst hinzugefügte Einträge darunter
      eigene.forEach(function (ext, nummer) {
        // Ohne Link: Suche im Store nach dem Namen
        const link = ext.link || "https://addons.mozilla.org/de/android/search/?q=" + encodeURIComponent(ext.name);
        const eintrag = baueEintrag(ext.name, "Selbst hinzugefügt", link);
        eintrag.classList.add("eigen");
        langDruecken(eintrag, function () {
          if (confirm("Entfernen?")) {
            eigene.splice(nummer, 1); // Eintrag aus der Liste nehmen
            speichereEigene(eigene);
            zeigeListe();
          }
        });
        extListe.appendChild(eintrag);
      });
    }

    // Langes Drücken (0,6 Sekunden) erkennen
    function langDruecken(element, aktion) {
      let zeitgeber = null;
      let warLang = false;

      element.addEventListener("pointerdown", function () {
        warLang = false;
        zeitgeber = setTimeout(function () {
          warLang = true;
          aktion();
        }, 600);
      });

      // Loslassen, Wegziehen oder Scrollen bricht ab
      for (const art of ["pointerup", "pointerleave", "pointercancel"]) {
        element.addEventListener(art, function () { clearTimeout(zeitgeber); });
      }

      // Nach langem Drücken den Link nicht öffnen
      element.addEventListener("click", function (ereignis) {
        if (warLang) ereignis.preventDefault();
      });

      // Kein Browser-Menü beim langen Drücken
      element.addEventListener("contextmenu", function (ereignis) {
        ereignis.preventDefault();
      });
    }

    zeigeListe();

    // ===== Knopf "+ Hinzufügen" und Formular =====
    const extFormular = document.getElementById("ext-formular");

    document.getElementById("ext-plus").addEventListener("click", function () {
      extFormular.classList.toggle("offen"); // Formular auf- bzw. zuklappen
      if (extFormular.classList.contains("offen")) {
        document.getElementById("ext-neu-name").focus();
      }
    });

    extFormular.addEventListener("submit", function (ereignis) {
      ereignis.preventDefault();
      const name = document.getElementById("ext-neu-name").value.trim();
      let link = document.getElementById("ext-neu-link").value.trim();
      if (name === "") return; // Name ist Pflicht

      // "https://" ergänzen, falls ein Link ohne angegeben wurde
      if (link !== "" && !link.startsWith("http://") && !link.startsWith("https://")) {
        link = "https://" + link;
      }

      eigene.push({ name: name, link: link });
      speichereEigene(eigene);
      zeigeListe();

      // Felder leeren und Formular zuklappen
      extFormular.reset();
      extFormular.classList.remove("offen");
    });

    // ===== Suche im Add-on-Store =====
    document.getElementById("ext-suchformular").addEventListener("submit", function (ereignis) {
      ereignis.preventDefault();
      const text = document.getElementById("ext-suchfeld").value.trim();
      if (text === "") return;
      window.location.href = "https://addons.mozilla.org/de/android/search/?q=" + encodeURIComponent(text);
    });

    // ===== Suchleiste =====
    document.getElementById("suchformular").addEventListener("submit", function (ereignis) {
      ereignis.preventDefault(); // verhindert, dass die Seite neu lädt

      const text = document.getElementById("suchfeld").value.trim();
      if (text === "") return;

      // Sieht es wie eine Webadresse aus? (kein Leerzeichen und ein Punkt drin)
      const istAdresse = !text.includes(" ") && text.includes(".");

      if (istAdresse) {
        // "https://" ergänzen, falls es fehlt
        const adresse = text.startsWith("http://") || text.startsWith("https://")
          ? text
          : "https://" + text;
        window.location.href = adresse;
      } else {
        // Sonst bei DuckDuckGo suchen
        window.location.href = "https://duckduckgo.com/?q=" + encodeURIComponent(text);
      }
    });
  </script>

</body>
</html>
