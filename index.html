<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Sorgt dafür, dass die Seite auf dem Handy in richtiger Größe angezeigt wird -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3Room</title>

  <style>
    /* ===== Grundeinstellungen ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent; /* kein grauer Kasten beim Antippen */
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, system-ui, sans-serif;
      color: white;
      background: #050507;              /* fast schwarz */
      padding: 56px 16px 40px;
    }

    /* Leichter, unscharfer Farbschimmer (dunkles Blau/Lila) hinter allem */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -1;
      background:
        radial-gradient(circle at 25% 20%, rgba(60, 70, 200, 0.35), transparent 45%),
        radial-gradient(circle at 80% 65%, rgba(120, 50, 180, 0.30), transparent 45%);
      filter: blur(60px);
    }

    /* Inhalt auf großen Bildschirmen nicht zu breit */
    .inhalt {
      max-width: 500px;
      margin: 0 auto;
    }

    /* ===== Suchleiste: schmal, dunkelgrau ===== */
    .suche {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      margin-bottom: 28px;
      padding: 0 10px;
      border-radius: 10px;
      background: #1c1c1e;
    }

    .suche svg {
      flex-shrink: 0;
    }

    .suche input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 16px;
    }

    .suche input::placeholder {
      color: #8e8e93;
    }

    /* ===== Kategorie-Kacheln: 2 pro Reihe ===== */
    .kacheln {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 18px;
    }

    .kategorie {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Der Milchglas-Kasten mit 2x2 Icons */
    .kasten {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 14px;
      border-radius: 24px;
      background: rgba(40, 40, 50, 0.45);   /* halbtransparent dunkel */
      backdrop-filter: blur(30px);          /* Hintergrund unscharf */
      -webkit-backdrop-filter: blur(30px);
      aspect-ratio: 1;                       /* immer quadratisch */
    }

    /* Kategorie-Name klein und grau unter der Kachel */
    .kategorie-name {
      font-size: 13px;
      color: #8e8e93;
      text-align: center;
    }

    /* ===== Ein App-Icon ===== */
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: white;
      cursor: pointer;
    }

    /* Das abgerundete Quadrat: Logo füllt es komplett */
    .icon {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 22%;
      overflow: hidden;
      background: #2c2c2e;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;  /* macht das Kleinerwerden weich */
    }

    .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Animation beim Antippen: Icon wird kurz kleiner */
    .app:active .icon,
    .mini:active {
      transform: scale(0.9);
    }

    /* Icon "Extensions": schwarzer Hintergrund */
    .icon.schwarz {
      background: black;
    }

    /* 4. Feld bei mehr als 4 Apps: kleine Mini-Icons der restlichen Apps */
    .mini {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      align-content: start;
      aspect-ratio: 1;
      padding: 2px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .mini .icon {
      border-radius: 24%;
    }

    /* Name unter dem Icon (nur im Kategorie-Fenster) */
    .name {
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 76px;
    }

    /* ===== Fenster (Overlay) ===== */
    /* Abgedunkelter Hintergrund über der ganzen Seite */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;               /* versteckt, bis es geöffnet wird */
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }

    .overlay.offen {
      display: flex;
    }

    /* Das Fenster selbst, mit dunklem Milchglas-Effekt */
    .fenster {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 22px;
      background: rgba(30, 30, 36, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .fenster-kopf {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .fenster-kopf h2 {
      font-size: 22px;
      font-weight: 700;
    }

    /* Runder X-Knopf zum Schließen */
    .schliessen {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 16px;
      line-height: 30px;
      cursor: pointer;
    }

    /* Suchleiste im Fenster: gleiche Optik, etwas weniger Abstand */
    .fenster .suche {
      margin-bottom: 16px;
    }

    /* Alle Apps einer Kategorie im Fenster: 4 pro Reihe */
    .fenster-raster {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 12px;
    }

    .fenster-raster .icon {
      width: 60px;
    }

    /* Liste der Extensions */
    .ext-liste {
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }

    .ext-eintrag {
      display: block;
      padding: 12px 14px;
      color: white;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ext-eintrag:last-child {
      border-bottom: none;
    }

    .ext-eintrag:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .ext-name {
      font-size: 16px;
      font-weight: 600;
    }

    .ext-text {
      font-size: 13px;
      color: #8e8e93;
      margin-top: 2px;
    }

    /* Selbst hinzugefügte Einträge: kein Markieren/Link-Menü beim langen Drücken */
    .ext-eintrag.eigen {
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Knopf "+ Hinzufügen" */
    .hinzufuegen {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .hinzufuegen:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Formular zum Hinzufügen (erst versteckt) */
    .ext-formular {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .ext-formular.offen {
      display: flex;
    }

    .ext-formular input {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: #1c1c1e;
      color: white;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .ext-formular input::placeholder {
      color: #8e8e93;
    }

    /* Kleiner grauer Hinweis ganz unten */
    .hinweis {
      margin-top: 14px;
      font-size: 12px;
      text-align: center;
      color: #8e8e93;
    }
  </style>
</head>
<body>

  <div class="inhalt">
    <!-- Suchleiste -->
    <form class="suche" id="suchformular">
      <!-- Lupen-Symbol (grau) -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input type="text" id="suchfeld" placeholder="Suchen" autocomplete="off">
    </form>

    <!-- Hier werden die Kategorie-Kacheln per JavaScript eingefügt -->
    <div class="kacheln" id="kacheln"></div>
  </div>

  <!-- Fenster für alle Apps einer Kategorie (bei mehr als 4 Apps) -->
  <div class="overlay" id="kat-overlay">
    <div class="fenster">
      <div class="fenster-kopf">
        <h2 id="kat-titel"></h2>
        <button class="schliessen" aria-label="Schließen">✕</button>
      </div>
      <div class="fenster-raster" id="kat-raster"></div>
    </div>
  </div>

  <!-- Fenster "Extensions" (erst versteckt, öffnet sich beim Tipp aufs Icon) -->
  <div class="overlay" id="ext-overlay">
    <div class="fenster">
      <div class="fenster-kopf">
        <h2>Extensions</h2>
        <button class="schliessen" aria-label="Schließen">✕</button>
      </div>

      <!-- Suche im Firefox-Add-on-Store -->
      <form class="suche" id="ext-suchformular">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input type="text" id="ext-suchfeld" placeholder="Add-ons suchen" autocomplete="off">
      </form>

      <!-- Hier wird die Liste per JavaScript eingefügt -->
      <div class="ext-liste" id="ext-liste"></div>

      <!-- Eigene Einträge hinzufügen -->
      <button class="hinzufuegen" id="ext-plus">+ Hinzufügen</button>
      <form class="ext-formular" id="ext-formular">
        <input type="text" id="ext-neu-name" placeholder="Name" autocomplete="off" required>
        <input type="text" id="ext-neu-link" placeholder="Link (optional)" autocomplete="off">
        <button type="submit" class="hinzufuegen">Speichern</button>
      </form>

      <p class="hinweis">Einstellungen ändern: Firefox ⋮ → Erweiterungen</p>
    </div>
  </div>

  <script>
    // =====================================================
    // DEINE APPS – hier kannst du einfach neue hinzufügen.
    // Einfach eine Zeile kopieren und Name, Link, Kategorie ändern.
    // Eine neue Kategorie bekommt automatisch eine eigene Kachel.
    // =====================================================
    const apps = [
      { name: "YouTube",    kategorie: "Medien", link: "https://www.youtube.com" },
      { name: "Instagram",  kategorie: "Social", link: "https://www.instagram.com" },
      { name: "Spotify",    kategorie: "Medien", link: "https://open.spotify.com" },
      { name: "Extensions", kategorie: "Tools",  aktion: "extensions" }, // öffnet das Extensions-Fenster
    ];

    // Lila Puzzleteil für das Icon "Extensions"
    const PUZZLE_SVG = `
      <svg width="60%" height="60%" viewBox="0 0 24 24" fill="#a855f7">
        <path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-2 .9-2 2v3.8h1.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/>
      </svg>`;

    // ===== Baut das abgerundete Quadrat einer App (ohne Link) =====
    function baueIcon(app) {
      const icon = document.createElement("div");
      icon.className = "icon";

      if (app.aktion === "extensions") {
        icon.classList.add("schwarz");
        icon.innerHTML = PUZZLE_SVG;
      } else {
        // Domain aus dem Link holen, z. B. "www.youtube.com", und Logo laden
        const domain = new URL(app.link).hostname;
        icon.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=128" alt="">`;
      }
      return icon;
    }

    // ===== Baut eine antippbare App (Icon, optional mit Name darunter) =====
    function baueApp(app, mitName) {
      const kachel = document.createElement("a");
      kachel.className = "app";
      kachel.appendChild(baueIcon(app));

      if (mitName) {
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = app.name;
        kachel.appendChild(name);
      }

      if (app.aktion === "extensions") {
        kachel.href = "#";
        kachel.addEventListener("click", function (ereignis) {
          ereignis.preventDefault(); // "#" nicht in die Adresse schreiben
          oeffne(extOverlay);
        });
      } else {
        kachel.href = app.link;  // öffnet im selben Tab
      }
      return kachel;
    }

    // ===== Kategorie-Kacheln automatisch bauen =====
    // Apps nach Kategorie sortieren (Reihenfolge: wie sie zuerst in der Liste vorkommen)
    const kategorien = {};
    for (const app of apps) {
      if (!kategorien[app.kategorie]) kategorien[app.kategorie] = [];
      kategorien[app.kategorie].push(app);
    }

    const kachelBereich = document.getElementById("kacheln");

    for (const [kategorie, liste] of Object.entries(kategorien)) {
      const block = document.createElement("div");
      block.className = "kategorie";

      const kasten = document.createElement("div");
      kasten.className = "kasten";

      if (liste.length <= 4) {
        // Bis zu 4 Apps: alle groß zeigen
        for (const app of liste) kasten.appendChild(baueApp(app, false));
      } else {
        // Mehr als 4: die ersten 3 groß, das 4. Feld zeigt Mini-Icons der restlichen
        for (const app of liste.slice(0, 3)) kasten.appendChild(baueApp(app, false));

        const mini = document.createElement("button");
        mini.className = "mini";
        for (const app of liste.slice(3, 7)) mini.appendChild(baueIcon(app));
        mini.addEventListener("click", function () {
          zeigeKategorie(kategorie, liste);
        });
        kasten.appendChild(mini);
      }

      const name = document.createElement("div");
      name.className = "kategorie-name";
      name.textContent = kategorie;

      block.appendChild(kasten);
      block.appendChild(name);
      kachelBereich.appendChild(block);
    }

    // ===== Fenster mit allen Apps einer Kategorie =====
    const katOverlay = document.getElementById("kat-overlay");

    function zeigeKategorie(kategorie, liste) {
      document.getElementById("kat-titel").textContent = kategorie;
      const katRaster = document.getElementById("kat-raster");
      katRaster.innerHTML = "";
      for (const app of liste) katRaster.appendChild(baueApp(app, true));
      oeffne(katOverlay);
    }

    // ===== Fenster öffnen und schließen (gilt für beide Fenster) =====
    const extOverlay = document.getElementById("ext-overlay");

    function oeffne(overlay) {
      overlay.classList.add("offen");
    }

    for (const overlay of document.querySelectorAll(".overlay")) {
      // X-Knopf schließt
      overlay.querySelector(".schliessen").addEventListener("click", function () {
        overlay.classList.remove("offen");
      });
      // Tipp außerhalb des Fensters (auf den dunklen Hintergrund) schließt
      overlay.addEventListener("click", function (ereignis) {
        if (ereignis.target === overlay) overlay.classList.remove("offen");
      });
    }

    // =====================================================
    // DEINE EXTENSIONS – hier kannst du neue hinzufügen.
    // Einfach eine Zeile kopieren und Name, Beschreibung, Link ändern.
    // =====================================================
    const extensions = [
      { name: "uBlock Origin", beschreibung: "Blockt Werbung",                       link: "https://addons.mozilla.org/de/android/addon/ublock-origin/" },
      { name: "SponsorBlock",  beschreibung: "Überspringt Werbeblöcke in Videos",    link: "https://addons.mozilla.org/de/android/addon/sponsorblock/" },
      { name: "Unhook",        beschreibung: "Blendet Empfehlungen und Shorts aus",  link: "https://addons.mozilla.org/de/android/search/?q=unhook" },
    ];

    // ===== Selbst hinzugefügte Einträge im Browser speichern (localStorage) =====
    const SPEICHER_NAME = "eigeneExtensions";

    function ladeEigene() {
      try {
        return JSON.parse(localStorage.getItem(SPEICHER_NAME)) || [];
      } catch (fehler) {
        return []; // z. B. im privaten Modus: dann eben leer
      }
    }

    function speichereEigene(liste) {
      try {
        localStorage.setItem(SPEICHER_NAME, JSON.stringify(liste));
      } catch (fehler) {
        // Speichern nicht möglich – Eintrag gilt dann nur bis zum Neuladen
      }
    }

    let eigene = ladeEigene();

    // Namen auf höchstens 21 Zeichen kürzen (20 Zeichen + "…")
    function kuerze(name) {
      return name.length > 21 ? name.slice(0, 20) + "…" : name;
    }

    // ===== Liste im Fenster füllen =====
    const extListe = document.getElementById("ext-liste");

    // Baut einen Listeneintrag (Name + optional Beschreibung)
    function baueEintrag(name, beschreibung, link) {
      const eintrag = document.createElement("a");
      eintrag.className = "ext-eintrag";
      eintrag.href = link;
      eintrag.innerHTML = `<div class="ext-name"></div><div class="ext-text"></div>`;
      eintrag.querySelector(".ext-name").textContent = kuerze(name);
      eintrag.querySelector(".ext-text").textContent = beschreibung;
      return eintrag;
    }

    function zeigeListe() {
      extListe.innerHTML = ""; // erst leeren, dann neu aufbauen

      // 1. Feste Einträge aus der Liste "extensions"
      for (const ext of extensions) {
        extListe.appendChild(baueEintrag(ext.name, ext.beschreibung, ext.link));
      }

      // 2. Selbst hinzugefügte Einträge darunter
      eigene.forEach(function (ext, nummer) {
        // Ohne Link: Suche im Store nach dem Namen
        const link = ext.link || "https://addons.mozilla.org/de/android/search/?q=" + encodeURIComponent(ext.name);
        const eintrag = baueEintrag(ext.name, "Selbst hinzugefügt", link);
        eintrag.classList.add("eigen");
        langDruecken(eintrag, function () {
          if (confirm("Entfernen?")) {
            eigene.splice(nummer, 1); // Eintrag aus der Liste nehmen
            speichereEigene(eigene);
            zeigeListe();
          }
        });
        extListe.appendChild(eintrag);
      });
    }

    // Langes Drücken (0,6 Sekunden) erkennen
    function langDruecken(element, aktion) {
      let zeitgeber = null;
      let warLang = false;

      element.addEventListener("pointerdown", function () {
        warLang = false;
        zeitgeber = setTimeout(function () {
          warLang = true;
          aktion();
        }, 600);
      });

      // Loslassen, Wegziehen oder Scrollen bricht ab
      for (const art of ["pointerup", "pointerleave", "pointercancel"]) {
        element.addEventListener(art, function () { clearTimeout(zeitgeber); });
      }

      // Nach langem Drücken den Link nicht öffnen
      element.addEventListener("click", function (ereignis) {
        if (warLang) ereignis.preventDefault();
      });

      // Kein Browser-Menü beim langen Drücken
      element.addEventListener("contextmenu", function (ereignis) {
        ereignis.preventDefault();
      });
    }

    zeigeListe();

    // ===== Knopf "+ Hinzufügen" und Formular =====
    const extFormular = document.getElementById("ext-formular");

    document.getElementById("ext-plus").addEventListener("click", function () {
      extFormular.classList.toggle("offen"); // Formular auf- bzw. zuklappen
      if (extFormular.classList.contains("offen")) {
        document.getElementById("ext-neu-name").focus();
      }
    });

    extFormular.addEventListener("submit", function (ereignis) {
      ereignis.preventDefault();
      const name = document.getElementById("ext-neu-name").value.trim();
      let link = document.getElementById("ext-neu-link").value.trim();
      if (name === "") return; // Name ist Pflicht

      // "https://" ergänzen, falls ein Link ohne angegeben wurde
      if (link !== "" && !link.startsWith("http://") && !link.startsWith("https://")) {
        link = "https://" + link;
      }

      eigene.push({ name: name, link: link });
      speichereEigene(eigene);
      zeigeListe();

      // Felder leeren und Formular zuklappen
      extFormular.reset();
      extFormular.classList.remove("offen");
    });

    // ===== Suche im Add-on-Store =====
    document.getElementById("ext-suchformular").addEventListener("submit", function (ereignis) {
      ereignis.preventDefault();
      const text = document.getElementById("ext-suchfeld").value.trim();
      if (text === "") return;
      window.location.href = "https://addons.mozilla.org/de/android/search/?q=" + encodeURIComponent(text);
    });

    // ===== Suchleiste =====
    document.getElementById("suchformular").addEventListener("submit", function (ereignis) {
      ereignis.preventDefault(); // verhindert, dass die Seite neu lädt

      const text = document.getElementById("suchfeld").value.trim();
      if (text === "") return;

      // Sieht es wie eine Webadresse aus? (kein Leerzeichen und ein Punkt drin)
      const istAdresse = !text.includes(" ") && text.includes(".");

      if (istAdresse) {
        // "https://" ergänzen, falls es fehlt
        const adresse = text.startsWith("http://") || text.startsWith("https://")
          ? text
          : "https://" + text;
        window.location.href = adresse;
      } else {
        // Sonst bei DuckDuckGo suchen
        window.location.href = "https://duckduckgo.com/?q=" + encodeURIComponent(text);
      }
    });
  </script>

</body>
</html>
